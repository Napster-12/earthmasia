<style>
body {
    font-family: "Times New Roman", serif;
    font-size: 12pt;
    line-height: 1.5;
    margin: 0;
}

/* ===== HERO SECTION ===== */
.hero-section {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
    color: white;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Background video */
#video-bg {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 120vw;
    height: 120vh;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: -2;
}

/* Dark overlay for readability */
.video-overlay {
    position: absolute;
    top:0; left:0;
    width:100%; height:100%;
    background: rgba(0,0,0,0.55);
    z-index: -1;
}

/* Hero Content */
.hero-content { z-index: 2; }

.hero-title {
    font-size: 3.2rem;
    font-weight: bold;
    margin-bottom: 15px;
}

.hero-sub {
    font-size: 1.3rem;
    max-width: 700px;
    margin: 0 auto;
}

.btn-main {
    margin-top: 25px;
    padding: 12px 40px;
    font-size: 1.2rem;
    border-radius: 8px;
    background-color: #DAA520;
    border: none;
    color: white;
    transition: .3s;
}
.btn-main:hover { background-color: #c99718; }

/* ===== SECTION STYLES ===== */
.section-title {
    font-size: 2rem;
    font-weight: bold;
    margin-bottom: 10px;
    text-align: center;
}
.section-subtext {
    max-width: 750px;
    margin: 0 auto 40px;
    color: #555;
    text-align: center;
}

/* Features */
.feature-card {
    padding: 30px;
    border-radius: 15px;
    background: white;
    text-align: center;
    transition: .3s;
    height: 100%;
}
.feature-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 6px 20px rgba(0,0,0,0.1);
}
.feature-img { height: 70px; margin-bottom: 20px; }

/* CTA Section */
.cta-section {
    background: linear-gradient(90deg, #DAA520, #c99718);
    color: white;
    padding: 50px 20px;
    text-align: center;
    border-radius: 15px;
}
.cta-section a {
    display: inline-block;
    margin-top: 20px;
    padding: 12px 40px;
    font-size: 1.2rem;
    border-radius: 8px;
    background: white;
    color: #DAA520;
    font-weight: bold;
    text-decoration: none;
    transition: .3s;
}
.cta-section a:hover { background: #f2f2f2; }

/* Floating Contact Icons */
.contact-bottom {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 9999;
    display: flex;
    gap: 12px;
}
.contact-bottom a {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    font-size: 22px;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    text-decoration: none;
    transition: .3s;
}
.contact-bottom a.whatsapp { background:#25D366; }
.contact-bottom a.email { background:#1D6ED9; }
.contact-bottom a.call { background:#007bff; }
.contact-bottom a:hover { opacity: .85; transform: translateY(-2px); }

/* ===== RESPONSIVE ===== */
@media(max-width: 991px){
    .hero-title { font-size: 2.5rem; }
    .hero-sub { font-size: 1.1rem; }
}

@media(max-width: 767px){
    .hero-section { height: 80vh; }

    #video-bg {
        width: 200vw;
        height: 200vh;
    }

    .hero-title { font-size: 2rem; }
    .hero-sub { font-size: 1rem; }

    .contact-bottom {
        bottom: 15px;
        right: 15px;
        gap: 10px;
    }

    .contact-bottom a {
        width: 45px;
        height: 45px;
        font-size: 20px;
    }

    .feature-card { padding: 20px; }
}

@media(max-width: 480px){
    .hero-title { font-size: 1.6rem; }
    .hero-sub { font-size: .9rem; }

    .btn-main { padding: 10px 25px; font-size: 1rem; }

    .cta-section a { padding: 10px 30px; font-size: 1rem; }

    .contact-bottom a {
        width: 40px;
        height: 40px;
        font-size: 18px;
    }
}
</style>
